# Full regression: build the port from a clean checkout and run every gating test on its full set (all but the M2
# measurements m2_oracle / m2_ega_capture, docs/ci.md), split into parallel jobs (tools/ci/check_pr.py --full: the parts
# of FULL in tools/ci/suite.py; docs/ci.md). Runs on demand (Actions tab or `gh workflow run`) and on pushes to
# regress/** branches (a branch may limit the parts: tools/ci/regress_only). Each part runs at the RAM-disk sizes 512K,
# 1M and 16M, except the parts whose tests never see the size (1M only), and one part also at 1M with 1 wait state (the
# MZPico): the matrix comes from tools/ci/regress_matrix.py (the inputs of a manual run, or tools/ci/regress_sizes and
# tools/ci/regress_only on the branch; docs/ci.md "The RAM-disk sizes").
# The original DOS data is downloaded at run time (tools/ci/fetch_dos_data.py, md5-checked) and never leaves the job:
# no artifact, no cache holds it or anything built from it (the repository is public).
name: Full regression

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'RAM-disk variants: 512K 1M 16M, 1M+N (N wait states), every-size (empty: tools/ci/regress_sizes or all)'
        required: false
        default: ''
      parts:
        description: 'Parts (empty: tools/ci/regress_only or all)'
        required: false
        default: ''
  push:
    branches: ['regress/**']

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL3_TAG: release-3.4.14
  SDL3_IMAGE_TAG: release-3.4.4
  MINIZIP_TAG: 4.2.2
  MZ800EMU_COMMIT: b4ebc084d639d360888d328d06e1b3bc49236c05   # wasm: MZPico/mz800emu#2 squash-merged (regions, mr1r18_wait)
  SDLPOP_COMMIT: 3c5add5fb7f83d4ceb542823ab66d00146c4271b
  MZDISK_COMMIT: 0db3add4b9964dc566442371852056b6aac61217
  BOMBERNET_COMMIT: ae509d5380830119be9fae20faac7272c4b5ac12   # relay/relay.py: the NET relay tests/duel_net.py runs locally

jobs:
  plan:
    name: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: m
        env:
          REGRESS_SIZES: ${{ inputs.sizes }}
          REGRESS_PARTS: ${{ inputs.parts }}
        run: |
          python3 tools/ci/regress_matrix.py --list
          python3 tools/ci/regress_matrix.py > /dev/null

  check:
    needs: plan
    name: full + ${{ matrix.part }} @ ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # empty = the INI's (emu/mz800emu.ini: 1M, 0 wait states); emu/mz800emu-pop.sh writes a copy per size/wait
      POP800_RD_SIZE: ${{ matrix.size }}
      POP800_RD_WAIT: ${{ matrix.wait }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pasmo p7zip-full xvfb xauth ninja-build cmake pkg-config \
            libsdl2-dev libsdl2-image-dev libglib2.0-dev libjson-glib-dev libcurl4-openssl-dev zlib1g-dev libgl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpng-dev libjpeg-dev > /dev/null
          echo "DEPS=$HOME/mzdeps" >> "$GITHUB_ENV"
          echo "EMU_DIR=$HOME/mz800emu-bin" >> "$GITHUB_ENV"
          echo "MZ800EMU_BIN=$HOME/mz800emu-bin/mz800emu" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/mzdeps/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/mzdeps/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt

      # the tools, cached by their versions (public sources only, no game data); restored here, saved right after a
      # build (before anything runs them)
      - name: Restore SDL3 / SDL3_image / minizip-ng
        id: c-deps
        uses: actions/cache/restore@v4
        with:
          path: ~/mzdeps
          key: mzdeps-ubuntu24-${{ env.SDL3_TAG }}-${{ env.SDL3_IMAGE_TAG }}-${{ env.MINIZIP_TAG }}-${{ hashFiles('tools/ci/build_deps.sh') }}
      - name: Restore mz800emu
        id: c-emu
        uses: actions/cache/restore@v4
        with:
          path: ~/mz800emu-bin
          key: mz800emu-ubuntu24-${{ env.MZ800EMU_COMMIT }}-${{ env.SDL3_TAG }}-${{ hashFiles('tools/ci/build_deps.sh') }}
      - name: Restore SDLPoP (patched)
        id: c-sdlpop
        uses: actions/cache/restore@v4
        with:
          path: external/SDLPoP
          key: sdlpop-ubuntu24-${{ env.SDLPOP_COMMIT }}-${{ hashFiles('tools/sdlpop-pop800.patch') }}-${{ hashFiles('tools/ci/build_deps.sh') }}
      - name: Restore mzdisk
        id: c-mzdisk
        uses: actions/cache/restore@v4
        with:
          path: external/mzdisk
          key: mzdisk-ubuntu24-${{ env.MZDISK_COMMIT }}-${{ hashFiles('tools/ci/build_deps.sh') }}
      - name: Build SDL3 / SDL3_image / minizip-ng
        if: steps.c-deps.outputs.cache-hit != 'true'
        run: tools/ci/build_deps.sh sdl3
      - if: steps.c-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/mzdeps
          key: ${{ steps.c-deps.outputs.cache-primary-key }}
      - name: Build SDLPoP
        if: steps.c-sdlpop.outputs.cache-hit != 'true'
        run: tools/ci/build_deps.sh sdlpop
      - if: steps.c-sdlpop.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/SDLPoP
          key: ${{ steps.c-sdlpop.outputs.cache-primary-key }}
      - name: Build mzdisk
        if: steps.c-mzdisk.outputs.cache-hit != 'true'
        run: tools/ci/build_deps.sh mzdisk
      - if: steps.c-mzdisk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/mzdisk
          key: ${{ steps.c-mzdisk.outputs.cache-primary-key }}
      - name: Build mz800emu
        if: steps.c-emu.outputs.cache-hit != 'true'
        run: tools/ci/build_deps.sh emu
      - if: steps.c-emu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/mz800emu-bin
          key: ${{ steps.c-emu.outputs.cache-primary-key }}

      - name: Fetch the DOS data (archive.org, md5-checked)
        run: python3 -I tools/ci/fetch_dos_data.py

      - name: Fetch the NET relay (BomberNet's relay/relay.py, pinned; tests/duel_net.py runs its TCP side on 127.0.0.1)
        run: |
          mkdir -p "$HOME/bombernet"
          curl -fsSL "https://raw.githubusercontent.com/MZPico/BomberNet/$BOMBERNET_COMMIT/relay/relay.py" -o "$HOME/bombernet/relay.py"
          echo "POP800_RELAY_PY=$HOME/bombernet/relay.py" >> "$GITHUB_ENV"

      - name: Build
        run: make ci-build

      - name: Full regression (${{ matrix.part }} @ ${{ matrix.label }})
        run: xvfb-run -a -s "-screen 0 1024x768x24" python3 tools/ci/check_pr.py --full --chosen ${{ matrix.part }}
